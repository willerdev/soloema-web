name: Deploy soloema-web

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_SOLOEMA_WEB != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_SOLOEMA_WEB"
        env:
          RENDER_DEPLOY_HOOK_SOLOEMA_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_SOLOEMA_WEB }}
